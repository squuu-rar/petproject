<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <h2 style="margin-bottom: 20px;">Library</h2>
            <nav style="color: var(--text-muted);">
                <p style="margin-bottom: 10px; color: var(--text-primary); cursor: pointer;">Home</p>
                <p style="margin-bottom: 10px; cursor: pointer;">Search</p>
                <p style="margin-bottom: 10px; cursor: pointer;">Your Library</p>
            </nav>
        </aside>

        <main class="track-list">
            <h1 style="margin-bottom: 24px;">All Tracks</h1>
            
            <!-- Normal Track -->
            <div class="track-card">
                <div class="play-overlay">
                    <svg class="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </div>
                <div class="track-info">
                    <p class="track-title">Midnight City</p>
                    <p class="track-artist">M83</p>
                </div>
            </div>

            <!-- Playing Track -->
            <div class="track-card playing">
                <div class="play-overlay">
                    <svg class="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </div>
                <div class="track-info">
                    <p class="track-title">Blinding Lights</p>
                    <p class="track-artist">The Weeknd</p>
                </div>
            </div>

            <!-- Another Track -->
            <div class="track-card">
                <div class="play-overlay">
                    <svg class="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </div>
                <div class="track-info">
                    <p class="track-title">Starboy</p>
                    <p class="track-artist">The Weeknd</p>
                </div>
            </div>
        </main>

        <footer class="player-dock">
            <div style="width: 100%; display: flex; align-items: center; justify-content: space-between;">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <div style="width: 56px; height: 56px; background: #333; border-radius: 4px;"></div>
                    <div>
                        <p style="font-weight: 500; font-size: 0.9rem;">Current Song</p>
                        <p style="font-size: 0.8rem; color: var(--text-muted);">Artist</p>
                    </div>
                </div>
                <div style="color: var(--accent);">
                    <span>⏮ ⏸ ⏭</span>
                </div>
                <div style="width: 100px; height: 4px; background: #333; border-radius: 2px;"></div>
            </div>
        </footer>
    </div>

    <script>
        // Simple interaction for demo
        document.querySelectorAll('.track-card').forEach(card => {
            card.addEventListener('click', () => {
                document.querySelectorAll('.track-card').forEach(c => c.classList.remove('playing'));
                card.classList.add('playing');
            });
        });
    </script>
</body>
</html>
