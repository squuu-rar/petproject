<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-compact-disc fa-spin"></i>
                <span>MusicStream</span>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active" data-view="library">
                    <i class="fas fa-home"></i> <span>Library</span>
                </a>
                <a href="#" class="nav-item" data-view="search">
                    <i class="fas fa-search"></i> <span>Search</span>
                </a>
                <a href="#" class="nav-item" data-view="favorites">
                <a href="#" class="nav-item" data-view="wave"><i class="fas fa-water"></i> Моя Волна</a>
                    <i class="fas fa-heart"></i> <span>Любимые треки</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <div class="search-container">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search-input" placeholder="Search tracks, artists, albums...">
                </div>
            </header>

            <section class="content-area" id="content-area">
                <h2 id="view-title">Your Library</h2>
                <div class="tracklist-container" id="tracklist">
                    <div class="loader"></div>
                </div>
            </section>
        </main>

        <!-- Player Dock -->
        <footer class="player-dock">
            <div class="player-info">
                <img id="player-cover" src="/static/img/default-cover.svg" referrerpolicy="no-referrer" alt="Cover" class="mini-cover">
                <div class="track-details">
                    <div id="player-title" class="track-title">No track selected</div>
                    <div id="player-artist" class="track-artist">Select a song</div>
                </div>
                <button id="btn-like-player" class="icon-btn"><i class="far fa-heart"></i></button>
            </div>

            <div class="player-controls">
                <div class="control-buttons">
                    <button class="icon-btn" id="btn-prev"><i class="fas fa-step-backward"></i></button>
                    <button class="icon-btn play-btn" id="btn-play"><i class="fas fa-play-circle"></i></button>
                    <button class="icon-btn" id="btn-next"><i class="fas fa-step-forward"></i></button>
                </div>
                <div class="progress-container">
                    <span id="time-current">0:00</span>
                    <div class="progress-bar">
                        <div id="progress-fill" class="progress-fill"></div>
                    </div>
                    <span id="time-total">0:00</span>
                </div>
            </div>

            <div class="player-volume">
                <button id="btn-mute" class="icon-btn"><i class="fas fa-volume-up"></i></button>
                <input type="range" id="volume-range" min="0" max="100" value="70" class="volume-range">
            </div>
        </footer>

        <audio id="audio-player"></audio>
    </div>
    
    <!-- Fullscreen Lyrics Overlay -->
    <div id="lyrics-overlay" class="lyrics-overlay hidden">
        <button id="btn-close-lyrics" class="btn-close-lyrics" title="Свернуть">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
        <div class="lyrics-content">
            <div class="lyrics-left">
                <img id="lyrics-cover" src="/static/img/default-cover.svg" referrerpolicy="no-referrer" alt="Cover" class="lyrics-big-cover">
                <div class="lyrics-track-info">
                    <h2 id="lyrics-title" class="lyrics-title">Название трека</h2>
                    <p id="lyrics-artist" class="lyrics-artist">Исполнитель</p>
                </div>
                <div class="lyrics-progress-wrap">
                    <div class="lyrics-progress-bar" id="lyrics-progress-container">
                        <div id="lyrics-progress-fill" class="lyrics-progress-fill"></div>
                    </div>
                    <div class="lyrics-time-display">
                        <span id="lyrics-time-current">0:00</span>
                        <span id="lyrics-time-total">0:00</span>
                    </div>
                </div>
            </div>
            <div class="lyrics-right" id="lyrics-scroll-container">
                <div id="lyrics-lines" class="lyrics-lines">
                    <p class="lyrics-status">Нажмите на трек для загрузки текста</p>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
