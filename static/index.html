<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-compact-disc fa-spin"></i>
                <span>MusicStream</span>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active" data-view="library">
                    <i class="fas fa-home"></i> <span>Library</span>
                </a>
                <a href="#" class="nav-item" data-view="search">
                    <i class="fas fa-search"></i> <span>Search</span>
                </a>
                <a href="#" class="nav-item" data-view="liked">
                    <i class="fas fa-heart"></i> <span>Liked</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <div class="search-container">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search-input" placeholder="Search tracks, artists, albums...">
                </div>
            </header>

            <section class="content-area" id="content-area">
                <h2 id="view-title">Your Library</h2>
                <div class="tracklist-container" id="tracklist">
                    <!-- Tracks will be injected here -->
                    <div class="loader"></div>
                </div>
            </section>
        </main>

        <!-- Player Dock -->
        <footer class="player-dock">
            <div class="player-info">
                <img id="player-cover" src="/static/img/default-cover.png" alt="Cover" class="mini-cover">
                <div class="track-details">
                    <div id="player-title" class="track-title">No track selected</div>
                    <div id="player-artist" class="track-artist">Select a song</div>
                </div>
                <button id="btn-like-player" class="icon-btn"><i class="far fa-heart"></i></button>
            </div>

            <div class="player-controls">
                <div class="control-buttons">
                    <button class="icon-btn" id="btn-prev"><i class="fas fa-step-backward"></i></button>
                    <button class="icon-btn play-btn" id="btn-play"><i class="fas fa-play-circle"></i></button>
                    <button class="icon-btn" id="btn-next"><i class="fas fa-step-forward"></i></button>
                </div>
                <div class="progress-container">
                    <span id="time-current">0:00</span>
                    <div class="progress-bar">
                        <div id="progress-fill" class="progress-fill"></div>
                    </div>
                    <span id="time-total">0:00</span>
                </div>
            </div>

            <div class="player-volume">
                <i class="fas fa-volume-up"></i>
                <div class="volume-slider">
                    <div id="volume-fill" class="volume-fill"></div>
                </div>
            </div>
        </footer>

        <audio id="audio-player"></audio>
    </div>
    <script src="/static/js/app.js"></script>
</body>
</html>
