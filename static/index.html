<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="view-library">
    <aside class="sidebar">
        <div class="sidebar-logo">
            <i class="fas fa-compact-disc fa-spin-pulse"></i>
            <span>MusicStream</span>
        </div>
        <nav class="sidebar-nav">
            <a href="#" class="nav-item active" data-view="library"><i class="fas fa-home"></i> Библиотека</a>
            <a href="#" class="nav-item" data-view="wave"><i class="fas fa-water"></i> Моя Волна</a>
            <a href="#" class="nav-item" data-view="search"><i class="fas fa-search"></i> Поиск</a>
            <a href="#" class="nav-item" data-view="favorites"><i class="fas fa-heart"></i> Любимые треки</a>
        </nav>
    </aside>

    <main class="main-content" id="main-content">
        <header class="content-header">
            <h1 class="view-title" id="view-title">Библиотека</h1>
        </header>
        <section id="tracklist"></section>
    </main>

    <!-- Нижний плеер (скрывается в режиме волны) -->
    <footer class="player-dock" id="player-dock">
        <div class="player-dock-left player-info">
            <img src="/static/img/default-cover.svg" alt="Cover" class="player-dock-cover" id="player-cover">
            <div class="player-dock-titles">
                <span class="player-dock-title" id="player-title">Трек не выбран</span>
                <span class="player-dock-artist" id="player-artist">—</span>
            </div>
            <button class="track-like-btn" id="btn-like-player">
                <i class="far fa-heart"></i>
            </button>
        </div>

        <div class="player-dock-center">
            <div class="player-controls-row">
                <button class="control-btn" id="btn-prev"><i class="fas fa-backward-step"></i></button>
                <button class="control-btn control-btn-play" id="btn-play"><i class="fas fa-play-circle"></i></button>
                <button class="control-btn" id="btn-next"><i class="fas fa-forward-step"></i></button>
            </div>
            <div class="player-progress-container">
                <span class="progress-time" id="time-current">0:00</span>
                <div class="progress-track">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <span class="progress-time" id="time-total">0:00</span>
            </div>
        </div>

        <div class="player-dock-right">
            <button class="control-btn" id="btn-mute"><i class="fas fa-volume-up"></i></button>
            <input type="range" class="volume-bar" id="volume-range" min="0" max="100" value="70">
        </div>
    </footer>

    <audio id="audio-player" preload="metadata"></audio>
    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
